<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --red: #ff0000;
      --red-dim: #cc0000;
      --bg: #0f0f0f;
      --line: #303030;
      --text: #f1f1f1;
      --muted: #a0a0a0;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      width: 268px;
      margin: 0;
      padding: 15px 16px 14px;
      background: var(--bg);
      color: var(--text);
      font-family: "Roboto", -apple-system, "SF Pro Text", Arial, sans-serif;
    }

    header { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }

    .logo {
      width: 26px; height: 26px;
      flex: 0 0 auto;
      display: block;
      border-radius: 7px;
    }


    h1 { font-size: 13px; font-weight: 700; margin: 0; letter-spacing: -0.1px; }

    .row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 9px 0; font-size: 13px;
      border-top: 1px solid var(--line);
    }

    .row:first-of-type { border-top: none; }

    .switch { position: relative; width: 38px; height: 21px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; inset: 0;
      background: #4a4a4a; border-radius: 999px;
      cursor: pointer; transition: background 0.16s ease;
    }

    .slider::before {
      content: ""; position: absolute;
      width: 15px; height: 15px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%;
      transition: transform 0.16s ease;
    }

    .switch input:checked + .slider { background: var(--red); }
    .switch input:checked + .slider::before { transform: translateX(17px); }

    .row.disabled { opacity: 0.4; pointer-events: none; }

    #status {
      font-size: 11px; color: var(--muted);
      margin: 12px 0 12px; min-height: 15px; line-height: 1.4;
    }

    button {
      width: 100%;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 9px;
      cursor: pointer;
      margin-bottom: 7px;
      transition: background 0.14s ease, border-color 0.14s ease;
    }

    button:hover { border-color: #5a5a5a; background: #1a1a1a; }

    button.primary { background: var(--red); border-color: var(--red); color: #fff; }
    button.primary:hover { background: var(--red-dim); border-color: var(--red-dim); }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="icons/icon128.png" alt="">
    <h1>Comment Markers</h1>
  </header>

  <div class="row">
    <span>Enabled</span>
    <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
  </div>
  <div class="row">
    <span>Auto-popup</span>
    <label class="switch"><input type="checkbox" id="autoPopup"><span class="slider"></span></label>
  </div>
  <div class="row">
    <span>Avatars on timeline</span>
    <label class="switch"><input type="checkbox" id="markerAvatars"><span class="slider"></span></label>
  </div>

  <div class="row" id="videoRow">
    <span>On this video</span>
    <label class="switch"><input type="checkbox" id="videoEnabled"><span class="slider"></span></label>
  </div>

  <div id="status">…</div>

  <button id="rescan" class="primary">Rescan comments</button>
  <button id="options">All settings</button>

  <script src="popup.js"></script>
</body>
</html>
